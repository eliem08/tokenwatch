[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenwatch"
version = "0.1.0"
description = "Token/cost observability for coding-agent session logs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ilyass Emssaad" }]
keywords = ["llm", "tokens", "cost", "observability", "coding-agents", "claude-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tokenwatch = "tokenwatch.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenwatch*"]
